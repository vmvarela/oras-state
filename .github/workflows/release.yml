name: Release

on:
  push:
    branches:
      - master
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (without the v prefix). Leave empty to use VERSION."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: |
          go test -race -count=1 -timeout 10m ./...
          go vet ./...

      - name: Publish release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          DRAFT_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100"               --jq '.[] | select(.draft == true) | .id' | head -n1
          )"

          if [[ -n "$DRAFT_ID" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"               -f tag_name="$TAG"               -f target_commitish="$GITHUB_SHA"               -f name="$TAG"               -F draft=false               -f make_latest=true >/dev/null
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$TAG"               --generate-notes
          fi
