name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_ghcr:
        description: Run live GHCR integration tests (writes to ghcr.io/vmvarela/oras-state)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Check module tidiness
        run: |
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            git diff -- go.mod go.sum
            exit 1
          fi
      - run: go vet ./...

  zot-integration:
    name: Integration Test (Zot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          TF_ORAS_ZOT_TEST: "1"
        run: go test -race -v -timeout 120s ./... -run Zot

  harbor-integration:
    name: Integration Test (Harbor)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Harbor
        run: |
          set -euo pipefail
          curl -fsSL -o harbor.tgz \
            https://github.com/goharbor/harbor/releases/download/v2.15.4/harbor-online-installer-v2.15.4.tgz
          tar xzf harbor.tgz
          cp harbor/harbor.yml.tmpl harbor/harbor.yml
          # Plain HTTP on 8080. The installer refuses only 127.0.0.1 and the
          # template default as hostname; localhost is served by the same runner.
          sed -i \
            -e 's/^hostname: .*/hostname: localhost/' \
            -e 's/^  port: 80$/  port: 8080/' \
            -e 's/^https:$/#https:/' \
            -e 's/^  port: 443$/  # port: 443/' \
            -e 's|^  certificate: |  # certificate: |' \
            -e 's|^  private_key: |  # private_key: |' \
            harbor/harbor.yml
          sudo ./harbor/install.sh
      - name: Wait for Harbor
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v2.0/ping >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Harbor did not answer within 5 minutes"
          docker compose -p harbor logs --tail=200
          exit 1
      - name: Run Harbor integration tests
        env:
          TF_ORAS_HARBOR_TEST: "1"
          TF_ORAS_HARBOR_ADDR: localhost:8080
          TF_ORAS_HARBOR_USERNAME: admin
          TF_ORAS_HARBOR_PASSWORD: Harbor12345
        run: go test -race -count=1 -v -timeout 300s ./... -run Harbor
      - name: Dump Harbor logs
        if: failure()
        run: docker compose -p harbor logs --tail=200

  ghcr-integration:
    name: Integration Test (GHCR)
    if: github.event_name == 'workflow_dispatch' && inputs.run_ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - env:
          TF_ORAS_GHCR_TEST: "1"
          TF_ORAS_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -race -v -timeout 300s ./... -run TestGHCRIntegration
