name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_ghcr:
        description: Run live GHCR integration tests (writes to ghcr.io/vmvarela/oras-state)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 10m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Check module tidiness
        run: |
          if [[ -n "$(git status --porcelain go.mod go.sum)" ]]; then
            git diff -- go.mod go.sum
            exit 1
          fi
      - run: go vet ./...

  zot-integration:
    name: Integration Test (Zot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          TF_ORAS_ZOT_TEST: "1"
        run: go test -race -v -timeout 120s ./... -run Zot

  ghcr-integration:
    name: Integration Test (GHCR)
    if: github.event_name == 'workflow_dispatch' && inputs.run_ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          TF_ORAS_GHCR_TEST: "1"
          TF_ORAS_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -race -v -timeout 300s ./... -run TestGHCRIntegration
